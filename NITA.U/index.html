<!DOCTYPE html>
<html>
<head>
    <title>Uganda National IT Skills Assessment 2026</title>
    <link rel="stylesheet" href="survey.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <img src="Court-of-arms.jpg"
             alt="Uganda Coat of Arms"
             style="max-width:80px;">

        <h1>National Information Technology Authority — Uganda</h1>

    </header>


    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Home</a>
    </nav>


    <!-- SURVEY BANNER -->
    <section class="banner">

        <img src="image7.png"  style="width: 180px;">

        <div class="banner-title">
            <h2>Uganda National IT Skills Assessment 2026</h2>
        </div>

    </section>


    <!-- PROGRESS INDICATOR -->
    <section class="progress">

        <div class="step active">
            <span>1</span>
            <p>Respondent Details</p>
        </div>

        <div class="step">
            <span>2</span>
            <p>Skills Assessment</p>
        </div>

        <div class="step">
            <span>3</span>
            <p>Submit</p>
        </div>

    </section>


    <!-- RESPONDENT DETAILS FORM -->
    <main>

        <form>

            <fieldset>

                <legend>Respondent Details</legend>


                <!-- TITLE -->
                <div class="form-group">

                    <label for="title">Title:</label>

                    <select id="title" name="title" required>
                        <option value="">Select Title</option>
                        <option>Mr</option>
                        <option>Mrs</option>
                        <option>Ms</option>
                        <option>Dr</option>
                    </select>

                </div>


                <!-- FULL NAME -->
                <div class="form-group">

                    <label for="fullname">Full Name:</label>

                    <input type="text"
                           id="fullname"
                           name="fullname"
                           minlength="4"
                           required>

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">Email:</label>

                    <input type="email"
                           id="email"
                           name="email"
                           required>

                </div>


                <!-- PHONE -->
                <div class="form-group">

                    <label for="phone">Phone:</label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           pattern="\+256[0-9]{9}"
                           placeholder="+256700000000">

                </div>


                <!-- DATE OF BIRTH -->
                <div class="form-group">

                    <label for="dob">Date of Birth:</label>

                    <input type="date"
                           id="dob"
                           name="dob">

                </div>


                <!-- GENDER -->
                <div class="form-group">

                    <label>Gender:</label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Prefer not to say">
                            Prefer not to say
                        </label>

                    </div>

                </div>


                <!-- REGION -->
                <div class="form-group">

                    <label for="region">Region:</label>

                    <select id="region" name="region" required>

                        <option value="">Select Region</option>
                        <option>Central</option>
                        <option>Eastern</option>
                        <option>Northern</option>
                        <option>Western</option>

                    </select>

                </div>


                <!-- RESPONDENT CATEGORY -->
                <div class="form-group">

                    <label>Respondent Category:</label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="category" value="ICT Professional">
                            ICT Professional
                        </label>

                        <label>
                            <input type="radio" name="category" value="Government Officer">
                            Government Officer
                        </label>

                        <label>
                            <input type="radio" name="category" value="Student">
                            Student
                        </label>

                    </div>

                </div>


                <button type="submit">Continue to Skills Assessment</button>

            </fieldset>

        </form>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>&copy; 2026 National Information Technology Authority — Uganda</p>

    </footer>


</body>
</html>
